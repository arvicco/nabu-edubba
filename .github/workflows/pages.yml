name: Deploy site to GitHub Pages

# Deploys on EVERY push to main — merging a PR IS the deploy action
# (human-gated; owner ruling 2026-07-29: no manual dispatch step). No
# paths filter: a redundant rebuild is cheap, a silently missed deploy
# is not. Builds with OUR bundle (Jekyll 4.4, same Gemfile.lock as
# local and CI) rather than actions/jekyll-build-pages, so the deployed
# site is built by exactly the toolchain the gate verified.

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild rotates the featured drill cut (owner-ratified
    # 2026-08-05, rulebook cuneiform.md §8 "The deal"): re-renders
    # main with the build date, commits nothing — everything served
    # is content the gate verified at merge. Note GitHub pauses
    # scheduled workflows after ~60 days without repo activity.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # base_path is "/nabu-edubba" on the project URL and "" once the
        # custom domain is active — the build must work at either base,
        # which is also why all internal links go through relative_url.
        # EDUBBA_DEAL_DATE picks the featured drill cut (MJD mod 12);
        # gate/CI builds never set it, so they stay date-free.
        run: >-
          EDUBBA_DEAL_DATE="$(date -u +%F)"
          bundle exec jekyll build --source site --destination _site
          --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
