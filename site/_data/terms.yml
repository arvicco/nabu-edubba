# Technical-term glossary (owner request 2026-07-31): each term gets
# a hover bubble wherever it appears in prose, and an entry on the
# site-wide /terms/ page. Definitions are one plain sentence a modern
# reader can hold — no jargon defined by more jargon.
# The term linker matches these names case-insensitively (an optional
# plural -s is tolerated) in rendered text, outside links, headings,
# code, and figures' SVG.

terms:
  - name: glottal stop
    slug: glottal-stop
    school: hieroglyphs
    def: "a consonant made by briefly closing the throat — the catch in the middle of English \"uh-oh\""
  - name: glottal onset
    slug: glottal-onset
    school: hieroglyphs
    def: "a light throat-catch at the start of a syllable — the small click before \"apple\" said carefully"
  - name: pharyngeal
    slug: pharyngeal
    school: hieroglyphs
    def: "a consonant squeezed deep in the throat (like Arabic ʿayn); English has nothing similar"
  - name: emphatic
    slug: emphatic
    school: hieroglyphs
    def: "pronounced with extra tension further back in the throat than its plain twin — q versus k, ḥ versus h"
  - name: determinative
    slug: determinative
    def: "a silent sign at the end (in cuneiform, often the front) of a word that classifies it — person, god, place, motion — never pronounced"
  - name: phonogram
    slug: phonogram
    school: hieroglyphs
    def: "a sign used purely for its sound, whatever it happens to picture"
  - name: logogram
    slug: logogram
    def: "a sign that writes a whole word by itself"
  - name: ideogram
    slug: ideogram
    school: hieroglyphs
    def: "a sign meaning the very thing it depicts — in practice, another name for a logogram"
  - name: syllabogram
    school: akk
    slug: syllabogram
    def: "a sign spelling one syllable rather than a whole word — ba, du, an; the workhorse of Akkadian spelling"
  - name: polyvalency
    slug: polyvalency
    def: "one sign carrying several possible readings; context picks the right one"
  - name: uniliteral
    slug: uniliteral
    school: hieroglyphs
    def: "a sound-sign spelling exactly one consonant"
  - name: biliteral
    slug: biliteral
    school: hieroglyphs
    def: "a sound-sign spelling a fixed pair of consonants at once"
  - name: triliteral
    slug: triliteral
    school: hieroglyphs
    def: "a sound-sign spelling three consonants at once"
  - name: phonetic complement
    slug: phonetic-complement
    school: hieroglyphs
    def: "a sound-sign that repeats part of a neighboring sign's value — spelling belt-and-suspenders, for the reader's safety"
  - name: rebus
    slug: rebus
    def: "borrowing a picture for its sound instead of its meaning — drawing a sun to write \"son\""
  - name: cartouche
    slug: cartouche
    school: hieroglyphs
    def: "the rope ring drawn around a royal name in Egyptian writing"
  - name: serekh
    slug: serekh
    school: hieroglyphs
    def: "the palace-facade frame around the earliest Egyptian royal names — the cartouche's ancestor"
  - name: honorific transposition
    slug: honorific-transposition
    school: hieroglyphs
    def: "writing a king's or god's name first out of respect, even though it is read in its normal grammatical place"
  - name: transliteration
    slug: transliteration
    def: "the sign-by-sign rendering of ancient writing in modern letters, so every sign stays accountable"
  - name: hieratic
    slug: hieratic
    school: hieroglyphs
    def: "the fast cursive everyday form of Egyptian writing, done with brush and ink"
  - name: demotic
    slug: demotic
    school: hieroglyphs
    def: "the even faster successor of hieratic, used for daily business in later Egypt"
  - name: ostraca
    slug: ostraca
    school: hieroglyphs
    def: "flakes of limestone or broken pottery used as cheap writing surfaces — the ancient scratch paper"
  - name: suffix pronoun
    slug: suffix-pronoun
    school: hieroglyphs
    def: "a mini-pronoun glued to the end of a word — \"his\", \"your\", \"hers\" as a single sign"
  - name: particle
    slug: particle
    def: "a small function word that frames or flavors a sentence without naming any thing or action"
  - name: agglutinative
    slug: agglutinative
    def: "building words by stacking small pieces, each with exactly one job — like beads on a string"
  - name: homophony
    slug: homophony
    def: "several different signs sharing one sound — the mirror image of one sign having several readings"
  - name: titulary
    slug: titulary
    def: "a ruler's full formal string of names and titles, repeated in fixed order on monuments"
  - name: votive
    slug: votive
    def: "given to a god in fulfillment of a vow — votive objects carry dedication inscriptions"
  - name: pictograph
    slug: pictograph
    def: "an early sign that is still simply a picture of the thing it means"
  - name: paleography
    slug: paleography
    def: "reading the age and origin of a text from the changing shapes of its signs"
  - name: colophon
    slug: colophon
    def: "a scribe's closing note on a tablet or manuscript — title, owner, date, the ancient equivalent of a title page at the end"
  - name: terminative
    slug: terminative
    def: "the grammatical case meaning \"to, toward, up to\" — Sumerian marks it with -še₃"
  - name: genitive
    slug: genitive
    def: "the grammatical case of possession or belonging — \"the king's house\", \"lord of Lagash\""
  - name: ablative
    slug: ablative
    def: "the grammatical case meaning \"from, out of\" — Sumerian marks it with -ta"
  - name: ergative
    slug: ergative
    def: "the case marking the doer of an action verb — Sumerian tags it with -e, treating doers and be-ers differently"
  - name: dative
    slug: dative
    def: "the grammatical case meaning \"to, for (someone)\" — Sumerian marks it with -ra"
  - name: comitative
    slug: comitative
    def: "the grammatical case meaning \"together with\" — Sumerian marks it with -da"
  - name: locative
    slug: locative
    def: "the grammatical case meaning \"in, on, at\" — Sumerian marks it with -a"
  - name: copula
    slug: copula
    def: "a word or word-part meaning \"to be,\" linking a subject to what it is — Sumerian attaches it to the word itself: lugal-me-en, \"I am king\""
  - name: classifier
    slug: classifier
    def: "Egyptology's name for a determinative — the silent sign closing a word to say what kind of thing it is: person, speech, plural, idea"
  - name: cohortative
    slug: cohortative
    def: "the verb form that says \"let me / let us\" — a wish the speaker makes about their own action; Sumerian fronts the verb with ga-"
  - name: precative
    slug: precative
    def: "the verb form that says \"may he, may it be so\" — a wish aimed at someone else's action; Sumerian fronts the verb with ha-"
  - name: Winkelhaken
    slug: winkelhaken
    def: "the field's name (German, \"angle-hook\") for the corner wedge — the small open-angle impression made with the corner of the stylus tip"
  - name: transitive
    slug: transitive
    def: "a verb whose action lands on something — someone builds SOMETHING, eats SOMETHING; a verb that just happens (going, sitting) is intransitive"
  - name: verbal sentence
    slug: verbal-sentence
    school: hieroglyphs
    def: "a sentence built on a conjugated verb — in Middle Egyptian the verb comes first, wearing its subject as a suffix: ḏd≡f, \"he says\""
  - name: suffix conjugation
    slug: suffix-conjugation
    school: hieroglyphs
    def: "the Egyptian verb form whose subject is a suffix pronoun on the stem — the grammars' sḏm≡f, \"he hears\""
  - name: adverbial sentence
    slug: adverbial-sentence
    school: hieroglyphs
    def: "a sentence made of a subject and a where-phrase, no verb at all — Egyptian's sw m s,t≡f, \"he is in his place\""
  - name: nominal sentence
    slug: nominal-sentence
    school: hieroglyphs
    def: "a sentence made of nouns side by side, no verb \"to be\" at all — Egyptian's mw pw, \"it is water\""
  - name: nominalizer
    slug: nominalizer
    def: "a small word-part that folds a whole clause into a description or a thing — Sumerian's is -a: \"ate\" becomes \"who ate\""
  - name: homophone
    slug: homophone
    def: "one of several different words or signs sharing the same sound — like English \"two\", \"too\", and \"to\"; index numbers (e₂, u₄) tell same-sounding signs apart"
  - name: gur
    slug: gur
    def: "the big Mesopotamian grain measure — three hundred sila of roughly a liter each, so about 300 liters of barley; the granary's counterpart to the silver-scale's mina"
  - name: mina
    slug: mina
    def: "the Mesopotamian pound: a weight of about 500 grams, divided into sixty shekels — silver by the mina was serious wealth"
  - name: shekel
    slug: shekel
    def: "the basic Mesopotamian weight, about 8 grams — one shekel of silver was roughly a hired worker's monthly wage"
  - name: sumerogram
    school: akk
    slug: sumerogram
    def: "a Sumerian word-sign kept inside Akkadian text as learned shorthand — written LUGAL, read aloud as Akkadian šarrum, \"king\""
  - name: bound transcription
    school: akk
    slug: bound-transcription
    def: "the joined-up dictionary form of an Akkadian word (šarrum, awīlum), reconstructed from its syllable-by-syllable transliteration with vowel lengths marked"
  - name: consonantal root
    school: akk
    slug: consonantal-root
    def: "the consonant skeleton at the heart of a Semitic word — n-d-n \"give\" stays fixed while vowel patterns flex around it: nadānum, iddin, inaddin"
  - name: nominative
    school: akk
    slug: nominative
    def: "the case of the subject — the noun the sentence is about; Old Babylonian marks it with -um: šarrum, \"the king (does something)\""
  - name: accusative
    school: akk
    slug: accusative
    def: "the case of the direct object — the noun the action lands on; Old Babylonian marks it with -am: awīlam, \"(he accused) a man\""
  - name: mimation
    school: akk
    slug: mimation
    def: "the -m that closes Old Babylonian noun endings (šarrum, not šarru) — a hallmark of Hammurabi's stage of the language, dropped in later centuries"
  - name: construct state
    school: akk
    slug: construct-state
    def: "the stripped-down form a noun takes to bind with the noun after it — bēl šamê, \"lord-of-heaven\" — losing its ending to gain an \"of\""
  - name: preterite
    school: akk
    slug: preterite
    def: "the Akkadian verb shape for a done deed — iddi, \"he charged\": simple past, one word, subject included"
  - name: durative
    school: akk
    slug: durative
    def: "the Akkadian verb shape for what happens or shall happen — inaddin, \"he shall pay\": the laws pronounce every sentence in it"
  - name: infinitive
    school: akk
    slug: infinitive
    def: "a verb packed whole into a noun — ḫabālum, \"to wrong / the wronging\" — and, being a noun, it wears the case endings like any other"
  - name: verbal stem
    school: akk
    slug: verbal-stem
    def: "one of the shapes a verb's root can be built into — G the ground stem, D the doubled-middle, Š the causative, N the passive — each with its own preterite and durative"
