# Veterans whose sux value doubles unchanged as an OB syllable
# (a, na, ma, šu …) need no row — they simply read.
#
# LI is the pool-102 unpinned candidate (never taught in sux);
# Akkadian claims it first — same sign, same keyword (invariance).
