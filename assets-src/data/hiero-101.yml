# Curated sign pool — Hieroglyphs 101 (M4-2).
# The uniliteral (one-consonant) signs, the field's standard didactic
# start: every Middle Egyptian grammar opens with this set (Allen,
# *Middle Egyptian*, §2.5; Gardiner, *Egyptian Grammar*, §17 + Sign
# List). Iconic identifications follow Gardiner's Sign List;
# certainty: classic = textbook-standard, unclear = origin debated,
# do not teach as fact.
#
# codepoints are NOT stored here — bin/hiero_registry.rb resolves and
# VERIFIES each Gardiner code against the Unicode character database
# (EGYPTIAN HIEROGLYPH <code> names) and emits the registry with
# glyphs; freq_aes rank merged from assets-src/data/hiero-freq-aes.tsv
# (Gardiner-code counts over the aes corpus hiero annotations).
#
# translit: Leiden/Egyptological display form (D4-b); mdc: the ASCII
# corpus form. taught_in: the 101 chapter that teaches the sign.

signs:
  - { gardiner: G1,  translit: "ꜣ", mdc: "A", label: "Egyptian vulture",         sound: "glottal stop; conventionally read as 'a'", taught_in: 4, certainty: classic, keyword: "vulture" }
  - { gardiner: M17, translit: "j", mdc: "i", label: "flowering reed",           sound: "y/glottal onset; conventionally 'i'",       taught_in: 1, certainty: classic, keyword: "reed" }
  - { gardiner: Z4,  translit: "y", mdc: "y", label: "two strokes",              sound: "y (usually word-final)",                    taught_in: 4, certainty: classic, keyword: "pair", confusable_with: ["Z1", "Z2"] }
