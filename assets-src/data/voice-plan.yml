lines:
  101-09-xue-er-shi-xi:
    text: 學而時習之，不亦說乎？
    pinyin: xué ér shí xí zhī, bù yì yuè hū
  102-01-jun-jun-chen-chen:
    text: 君君，臣臣，父父，子子。
    pinyin: jūn jūn, chén chén, fù fù, zǐ zǐ
  102-04-shi-you-wu:
    text: 吾十有五而志于學。
    pinyin: wú shí yǒu wǔ ér zhì yú xué
  102-04-san-shi-er-li:
    text: 三十而立。
    pinyin: sān shí ér lì
  102-10-si-er-hou-yi:
    text: 死而後已。
    pinyin: sǐ ér hòu yǐ
  102-12-jun-shi-chen:
    text: 君使臣以禮，臣事君以忠。
    pinyin: jūn shǐ chén yǐ lǐ, chén shì jūn yǐ zhōng
  102-13-shang-shan-ruo-shui:
    text: 上善若水。
    pinyin: shàng shàn ruò shuǐ
  102-15-dao-fa-zi-ran:
    text: 道法自然。
    pinyin: dào fǎ zì rán
