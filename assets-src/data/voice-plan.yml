# The standard-voice plan (rulebook §2, owner ruling 2026-08-15):
# the single source of truth for ALL synthesized audio. engine: is
# the pinned voice (env ELEVENLABS_VOICE_ID / _MODEL_ID /
# _OUTPUT_FORMAT override at synth time; the API key is env-only,
# never here). syllables: one entry per published mp3 basename —
# text: is the CARRIER character actually spoken (chosen
# unambiguous for the target reading; polyphone overrides are
# deliberate). lines: classical reading lines, modern Mandarin.
# verify: tone (default) | line | loudness — what integrate demands.
# Triple carriers (X、X、X。 with cut: middle, 2026-08-15): the
# first synth round failed the tone gate 47 times — single-token
# utterances carry declarative declination (tone 1 sinks), weak
# rises, and final rebound. An enumerated triple keeps each token
# near citation form; integrate cuts the middle one (no onset
# creak, no final declination). voice_settings pins high
# stability for the same reason.
