# The standard-voice plan (rulebook §2, owner rulings 2026-08-15):
# the single source of truth for ALL synthesized audio. engine: is
# the pinned voice (env ELEVENLABS_* override at synth time; the
# API key is env-only, never here). syllables: one entry per
# published mp3 basename; text: the carrier actually spoken.
# LENGTH LAW (owner review: "syllables too short — a novice can't
# hear the tone"): syllable items speak at syllable_voice_settings
# pace and must land a voiced span inside syllable_span, or the
# gate refuses them. variants: fallback recipes tried in order
# (bare single first; a syllable's historically winning carrier —
# triple with middle cut, word with first cut, four-tone paradigm
# with second cut — kept behind it). verify: tone (default) |
# line | loudness.
