# Syllable-audio manifest — hand-curated source for
# bin/pinyin_audio.rb (rulebook §2: the acquisition pipeline).
# Every taught character's codex slug maps to a Wikimedia Commons
# recording: `file:` alone vendors the whole recording; add
# `syllable: N` to cut the Nth syllable out of a word recording
# (silence-segmented, then pitch-verified against the tone the
# queue's pinyin declares). `aliases:` map same-sound slugs to one
# file; `absent:` records characters with NO clean recording found
# (date-stamped), kept visible in every pipeline report.

