# Curated character pool for the sinograph school (both courses).
# S101 rows: chapter 0-9. S102 rows: course: 102, chapter 1-15
# (the grammar spine, rulebook §5; re-batched at the Gate-24
# rework, owner ruling 2026-08-12). Within-chapter row order is
# teaching order (the components-before-compounds law reads it).
signs:
- char: 人
  chapter: 0
  keyword: person
  pinyin: rén
  meaning: a human being; other people
  category: pictograph
  certainty: classic
  note: rank 7 of the whole corpus; two strokes. A walking figure in profile — the
    course's first character and the component the next two are built from.
- char: 大
  chapter: 0
  keyword: big
  pinyin: dà
  meaning: big, great
  category: pictograph
  certainty: classic
  note: 'rank 16; a person with arms spread wide — "big" shown, not said. IDS ⿻一人:
    the person is still visible inside.'
- char: 天
  chapter: 0
  keyword: heaven
  pinyin: tiān
  meaning: sky; Heaven, the ordering power
  category: pictograph
  certainty: stated
  note: rank 24; the line above the big person's head — what is over everything. Shuowen
    reads it as the anthropomorphic chain 人→大→天; oracle forms show a box-headed figure.
    The course's thesis in three characters.
- char: 土
  chapter: 0
  keyword: earth
  pinyin: tǔ
  meaning: earth, soil; the ground
  category: pictograph
  certainty: stated
  note: 'rank 360; a mound of earth on the ground-line — by the received account an
    earthen altar. Pulled forward to complete the ch00 cosmology: heaven above, earth
    below, and the king joining them.'
