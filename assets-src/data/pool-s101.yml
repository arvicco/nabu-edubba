# S101 curated pool — hand-edited source for bin/sino_curriculum.rb
# (which merges char-freq-kanripo.tsv and emits
# site/_data/sinographs101_queue.yml — never edit the queue by hand).
#
# chapter: the S101 chapter that teaches the character (1–3 fresh per
# chapter, the chapter-opening law). keyword: unique school-wide
# (rulebook §3 — Heisig-convergent where his keyword is the plain
# classical sense, historic sense otherwise; assigned from Kroll).
# pinyin: tone diacritics, never numbers (rulebook §2) — the
# generator cross-checks it against Unihan kMandarin. category with
# certainty labels like the hieroglyph pool: classic (the received
# six-scripts account is uncontroversial) / stated (a tradition
# says so; scholarship hedges) / unclear.
#
# Curated-pin basis notes follow concept §3.1: frequency pulls from
# the committed Kanripo table; simplicity/iconicity and didactic
# chaining justify any pull forward, recorded per character.

signs:
  - char: 人
    chapter: 0
    keyword: person
    pinyin: rén
    meaning: a human being; other people
    category: pictograph
    certainty: classic
    note: >-
      rank 7 of the whole corpus; two strokes. A walking figure in
      profile — the course's first character and the component the
      next two are built from.
  - char: 大
    chapter: 0
    keyword: big
    pinyin: dà
    meaning: big, great
    category: pictograph
    certainty: classic
    note: >-
      rank 16; a person with arms spread wide — "big" shown, not
      said. IDS ⿻一人: the person is still visible inside.
  - char: 天
    chapter: 0
    keyword: heaven
    pinyin: tiān
    meaning: sky; Heaven, the ordering power
    category: pictograph
    certainty: stated
    note: >-
      rank 24; the line above the big person's head — what is over
      everything. Shuowen reads it as the anthropomorphic chain
      人→大→天; oracle forms show a box-headed figure. The course's
      thesis in three characters.
  - char: 日
    chapter: 1
    keyword: sun
    pinyin: rì
    meaning: the sun; a day
    category: pictograph
    certainty: classic
    note: >-
      rank 38; the sun-disc squared by the brush, the dot of light
      kept as the middle stroke. Half of the ch01 compound demo.
  - char: 月
    chapter: 1
    keyword: moon
    slug: yue-moon
    pinyin: yuè
    meaning: the moon; a month
    category: pictograph
    certainty: classic
    note: >-
      rank 51; the crescent that never fills — the moon is drawn
      waxing. The other half of the demo.
  - char: 明
    chapter: 1
    keyword: bright
    pinyin: míng
    meaning: bright; to shine, to understand
    category: compound-ideograph
    certainty: classic
    note: >-
      rank 62; sun beside moon — the textbook meaning-compound, and
      the proof that characters are built from characters. Pulled a
      few ranks ahead of its strict seat to land in the chapter
      that needs it (its two halves are taught the same page).
  - char: 一
    chapter: 2
    keyword: one
    pinyin: yī
    meaning: one; whole, unified
    category: indicative
    certainty: classic
    note: >-
      rank 11; one stroke for one — the purest "point at it"
      character, and the single most-written stroke of the script.
  - char: 二
    chapter: 2
    keyword: two
    pinyin: èr
    meaning: two
    category: indicative
    certainty: classic
    note: rank 19; two strokes, the upper slightly shorter.
  - char: 三
    chapter: 2
    keyword: three
    pinyin: sān
    meaning: three; several
    category: indicative
    certainty: classic
    note: >-
      rank 20; three strokes, middle shortest — and the end of the
      pattern: four breaks it, which is the chapter's own joke and
      lesson (shown, not taught).
  - char: 山
    chapter: 3
    keyword: mountain
    pinyin: shān
    meaning: mountain, hill
    category: pictograph
    certainty: classic
    note: rank 44; three peaks in a row, the middle one tallest.
  - char: 水
    chapter: 3
    keyword: water
    pinyin: shuǐ
    meaning: water; a river
    category: pictograph
    certainty: classic
    note: >-
      rank 63; a stream mid-current — the center line is the flow,
      the side strokes the eddies.
  - char: 中
    chapter: 3
    keyword: middle
    pinyin: zhōng
    meaning: middle, center; within
    category: indicative
    certainty: stated
    note: >-
      rank 22; a line through the very center of a box — the old
      forms show a pole or banner planted mid-camp; the received
      account (a stroke through the middle) is the useful one.
      Pulled forward to sit with the landscape pair it locates
      (山中, 水中 — "amid the mountains", "in the water").
  - char: 子
    chapter: 4
    keyword: child
    pinyin: zǐ
    meaning: child, son; the Master; a title of respect
    category: pictograph
    certainty: classic
    note: >-
      rank 13; an infant — big head, spread arms, legs still
      swaddled into one line. Half of the 子曰 formula.
  - char: 曰
    chapter: 4
    keyword: say
    slug: yue-say
    pinyin: yuē
    meaning: to say — the quotation-opener of the classical books
    category: indicative
    certainty: stated
    note: >-
      rank 12; a mouth with a stroke of breath leaving it, by the
      received account. The other half of 子曰; nearly five million
      attestations, virtually all of them opening speech.
  - char: 王
    chapter: 4
    keyword: king
    pinyin: wáng
    meaning: king
    category: indicative
    certainty: unclear
    note: >-
      rank 29; the received reading joins the three horizontals —
      heaven, earth, humankind — with one vertical: the king is
      what connects them. Early forms suggest an axe blade of
      authority instead; the chapter says so honestly.
